# ==============================================================================
# CONFIGURACION DE LA BASE DE DATOS (MySQL) - PROYECTO 3D
# ==============================================================================
spring.datasource.url=jdbc:mysql://db:3306/proyecto_3d_jpa?createDatabaseIfNotExist=true&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==============================================================================
# CONFIGURACION DE JPA / HIBERNATE
# ==============================================================================
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.generate-ddl=true

# ==============================================================================
# LOGGING (Para ver los datos que insertas/buscas)
# ==============================================================================
logging.level.org.hibernate.orm.results=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# ==============================================================================
# CONFIGURACION JACKSON (JSON)
# ==============================================================================
spring.jackson.serialization.FAIL_ON_EMPTY_BEANS=false
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss

# Aumentar el limite de tamanyo para archivos individuales
spring.servlet.multipart.max-file-size=50MB

# Aumentar el limite de tamanyo para toda la peticion (por si suben varios archivos)
spring.servlet.multipart.max-request-size=50MB
